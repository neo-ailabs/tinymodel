[package]
name = "tm-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Apple Metal GPU backend for tinymodel (objc2-metal + MSL kernels)"

[dependencies]
thiserror = "2"
tm-core = { path = "../tm-core" }
tm-gguf = { path = "../tm-gguf" }
tm-lora = { path = "../tm-lora" }

[dev-dependencies]
tm-cpu = { path = "../tm-cpu" }
tm-models = { path = "../tm-models" }
tm-runtime = { path = "../tm-runtime" }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-metal = { version = "0.3", features = [
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }
