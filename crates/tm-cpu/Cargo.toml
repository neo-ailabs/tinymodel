[package]
name = "tm-cpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CPU compute kernels (generic, aarch64 NEON/dotprod/i8mm, x86_64) and thread pool for tinymodel"

[features]
default = ["edge"]
# Micro tier (Pi Zero 2W / Pi 4): ARMv8.0 NEON + T-MAC `TBL` lookup kernels (`lut`), minimal binary size.
micro = ["lut"]
# Edge / Host tier (Pi 5 / phones / Apple Silicon / x86): runtime ISA dispatch across dotprod + i8mm + lut.
edge = ["dotprod", "i8mm", "lut"]
lut = []
dotprod = ["lut"]
i8mm = ["dotprod"]

[dependencies]
tm-core = { path = "../tm-core" }
