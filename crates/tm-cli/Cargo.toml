[package]
name = "tm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line runner and benchmark tool for tinymodel"

[[bin]]
name = "tinymodel"
path = "src/main.rs"

[features]
default = ["edge", "metal", "vulkan"]
micro = ["tm-cpu/micro"]
edge = ["tm-cpu/edge"]
metal = ["dep:tm-metal"]
vulkan = ["dep:tm-vulkan"]

[dependencies]
anyhow = "1"
tm-core = { path = "../tm-core" }
tm-cpu = { path = "../tm-cpu", default-features = false }
tm-gguf = { path = "../tm-gguf" }
tm-metal = { path = "../tm-metal", optional = true }
tm-models = { path = "../tm-models" }
tm-tokenizer = { path = "../tm-tokenizer" }
tm-vulkan = { path = "../tm-vulkan", optional = true }
