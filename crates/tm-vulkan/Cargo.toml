[package]
name = "tm-vulkan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cross-platform Vulkan 1.2/1.3 compute backend for tinymodel (Android Mali/Adreno, Linux SBC V3DV/Mali, Desktop)"

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
thiserror = "2"
tm-core = { path = "../tm-core" }
tm-gguf = { path = "../tm-gguf" }

[build-dependencies]
naga = { version = "24", default-features = false, features = ["glsl-in", "spv-out"] }
