[workspace]
resolver = "2"
members = [
    "crates/tm-core",
    "crates/tm-gguf",
    "crates/tm-cpu",
    "crates/tm-metal",
    "crates/tm-vulkan",
    "crates/tm-tokenizer",
    "crates/tm-models",
    "crates/tm-runtime",
    "crates/tm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fromztoa/tinymodel"
rust-version = "1.98"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
